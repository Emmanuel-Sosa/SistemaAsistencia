<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - Ponche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column vh-100">

    <!-- Barra Superior limpia -->
    <nav class="navbar shadow-sm bg-white py-3">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 fw-bold text-dark">⏰ Control de Asistencia</span>
            <button class="btn btn-primary btn-sm px-3 py-2 fw-semibold" data-bs-toggle="modal" data-bs-target="#modalAdminLogin">
                Administrador
            </button>
        </div>
    </nav>

    <!-- Contenido Principal del Ponchador -->
    <div class="container d-flex flex-column align-items-center justify-content-start flex-grow-1 pt-5">
        <div class="card shadow-lg border-0 p-5 text-center mx-auto mt-4" style="width: 100%; max-width: 480px; border-radius: 1rem;">
            <h3 class="fw-bold mb-2">Registrar Ponche</h3>
            <p class="text-muted small mb-4">Escanee su código QR o ingrese su código.</p>

            <form id="formPonche">
                <div class="mb-3">
                    <input type="text" class="form-control form-control-lg text-center py-3" id="codigo" placeholder="Ingrese su código..." autocomplete="off" required autofocus style="font-size: 1.25rem;">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold text-uppercase" style="letter-spacing: 0.5px;">Registrar</button>
            </form>

            <!-- Aquí aparecerá la caja verde con la foto y los datos -->
            <div id="resultadoPonche" class="mt-4"></div>
        </div>
    </div>

    <!-- MODAL DE LOGIN ADMIN -->
    <div class="modal fade" id="modalAdminLogin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">🔐 Acceso de Administrador</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formLoginAdmin">
                        <div class="mb-3">
                            <label for="adminPass" class="form-label small fw-bold text-muted">Contraseña</label>
                            <input type="password" class="form-control py-2" id="adminPass" placeholder="Ingrese la contraseña" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-bold">Entrar al Panel</button>
                        </div>
                    </form>
                    <div id="alertaLogin" class="mt-3 text-center small"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script del Ponche y Login Admin -->
    <script>
        document.getElementById('formPonche').addEventListener('submit', async function(e) {
            e.preventDefault();
            const codigo = document.getElementById('codigo').value.trim();
            const resDiv = document.getElementById('resultadoPonche');

            try {
                const response = await fetch('/api/ponchar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigo })
                });
                const data = await response.json();

                if (response.ok) {
                    // Generar la foto o la inicial del empleado para la izquierda de la caja verde
                    let elementoFoto = '';
                    if (data.foto && data.foto !== 'default.png') {
                        elementoFoto = `<img src="/static/uploads/${data.foto}" class="rounded-circle border shadow-sm flex-shrink-0" width="60" height="60" style="object-fit: cover;" alt="Foto">`;
                    } else {
                        let inicial = data.empleado ? data.empleado[0].toUpperCase() : '?';
                        elementoFoto = `<div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center shadow-sm flex-shrink-0" style="width: 60px; height: 60px; font-size: 1.5rem; font-weight: bold;">${inicial}</div>`;
                    }

                    // Caja verde con diseño de filas/columnas (Foto a la izquierda, textos a la derecha)
                    resDiv.innerHTML = `
                        <div class="alert alert-success p-3 mb-0 shadow-sm text-start d-flex align-items-center gap-3 border-0">
                            ${elementoFoto}
                            <div>
                                <h5 class="fw-bold mb-1 text-dark">${data.empleado}</h5>
                                <div><span class="badge bg-success">${data.tipo}</span> <span class="small text-muted">a las ${data.hora}</span></div>
                            </div>
                        </div>
                    `;
                } else {
                    resDiv.innerHTML = `<div class="alert alert-danger py-2 mb-0 shadow-sm">${data.error}</div>`;
                }
                document.getElementById('codigo').value = '';
                document.getElementById('codigo').focus();
            } catch (err) {
                resDiv.innerHTML = `<div class="alert alert-danger py-2 mb-0 shadow-sm">Error de conexión.</div>`;
            }
        });

        document.getElementById('formLoginAdmin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('adminPass').value;
            const alerta = document.getElementById('alertaLogin');

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (response.ok) {
                    alerta.innerHTML = `<span class="text-success fw-bold">¡Acceso concedido! Redirigiendo...</span>`;
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 800);
                } else {
                    alerta.innerHTML = `<span class="text-danger fw-bold">Contraseña incorrecta.</span>`;
                }
            } catch (err) {
                alerta.innerHTML = `<span class="text-danger fw-bold">Error de conexión.</span>`;
            }
        });
    </script>
</body>
</html>
