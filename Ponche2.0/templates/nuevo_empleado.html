<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
    body.dark-mode {
        background-color: #121212 !important;
        color: #e0e0e0 !important;
    }
    body.dark-mode h1, body.dark-mode h2, body.dark-mode h3, 
    body.dark-mode h4, body.dark-mode h5, body.dark-mode h6,
    body.dark-mode span, body.dark-mode strong, body.dark-mode label,
    body.dark-mode p, body.dark-mode a:not(.btn) {
        color: #f8f9fa !important;
    }
    body.dark-mode .text-muted {
        color: #b0b0b0 !important;
    }
    body.dark-mode .card,
    body.dark-mode .modal-content,
    body.dark-mode .list-group-item {
        background-color: #1e1e1e !important;
        color: #e0e0e0 !important;
        border-color: #2c2c2c !important;
    }
    body.dark-mode .card-header,
    body.dark-mode .modal-header {
        background-color: #252525 !important;
        color: #ffffff !important;
        border-bottom: 1px solid #2c2c2c !important;
    }
    body.dark-mode .modal-footer {
        background-color: #1e1e1e !important;
        border-top: 1px solid #2c2c2c !important;
    }
    body.dark-mode .navbar {
        background-color: #1e1e1e !important;
        border-bottom: 1px solid #2c2c2c !important;
    }
    body.dark-mode .navbar-brand {
        color: #f8f9fa !important;
    }
    body.dark-mode .table {
        color: #e0e0e0 !important;
        border-color: #2c2c2c !important;
    }
    body.dark-mode .table th,
    body.dark-mode .table td {
        color: #e0e0e0 !important;
        background-color: transparent !important;
        border-color: #2c2c2c !important;
    }
    body.dark-mode .table-light,
    body.dark-mode .table-light th,
    body.dark-mode .table-light td {
        background-color: #252525 !important;
        color: #ffffff !important;
        border-color: #2c2c2c !important;
    }
    body.dark-mode .table-striped > tbody > tr:nth-of-type(odd) > * {
        background-color: rgba(255, 255, 255, 0.04) !important;
        color: #e0e0e0 !important;
    }
    body.dark-mode .form-control {
        background-color: #2a2a2a !important;
        color: #ffffff !important;
        border-color: #444 !important;
    }
    body.dark-mode .form-control:focus {
        background-color: #2a2a2a !important;
        color: #ffffff !important;
        border-color: #0d6efd !important;
    }
    body.dark-mode .dropdown-menu {
        background-color: #1e1e1e !important;
        border: 1px solid #2c2c2c !important;
    }
    body.dark-mode .dropdown-item {
        color: #e0e0e0 !important;
    }
    body.dark-mode .dropdown-item:hover {
        background-color: #2a2a2a !important;
        color: #ffffff !important;
    }
    body.dark-mode .dropdown-divider {
        border-color: #2c2c2c !important;
    }
    body.dark-mode .btn-close {
        filter: invert(1) grayscale(100%) brightness(200%);
    }

    /* 🖨️ REGLAS DE IMPRESIÓN: Solo imprime el carné */
    @media print {
        body * {
            visibility: hidden;
        }
        #zonaCarnet, #zonaCarnet * {
            visibility: visible;
        }
        #zonaCarnet {
            position: absolute;
            left: 50%;
            top: 40px;
            transform: translateX(-50%);
            box-shadow: none !important;
            border: 1px solid #ddd !important;
            width: 320px !important;
        }
    }
</style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 450px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold">➕ Nuevo Empleado</h4>
            <p class="text-muted small">El código se asignará automáticamente</p>
        </div>

        <form id="formNuevoEmpleado" enctype="multipart/form-data">
            <div class="mb-3 bg-white p-3 border rounded text-center">
                <span class="text-muted small d-block">Código asignado para este empleado:</span>
                <h3 class="fw-bold text-primary mb-0" id="lblCodigo">Cargando...</h3>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label fw-bold small">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ej. Carlos Mendoza" required>
            </div>

            <div class="mb-3">
                <label for="foto" class="form-label fw-bold small">Fotografía (Opcional)</label>
                <input type="file" class="form-control form-control-sm" id="foto" accept="image/*">
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Registrar y Generar Carnet</button>
                <a href="/admin" class="btn btn-outline-secondary">Cancelar / Volver</a>
            </div>
        </form>

        <div id="mensajeAlerta" class="mt-3 text-center small"></div>
    </div>

    <!-- MODAL PARA MOSTRAR EL CARNET RECIÉN CREADO -->
    <div class="modal fade" id="modalCarnet" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">🪪 Carnet Generado con Éxito</h5>
                </div>
                <div class="modal-body text-center p-4">
                    <div id="zonaCarnet" class="card border shadow mx-auto p-3 text-center bg-white" style="width: 300px; border-radius: 12px;">
                        <div class="fw-bold text-uppercase text-secondary small mb-2">Control de Asistencia</div>
                        
                        <div class="mb-2" id="modalFotoContenedor"></div>

                        <h5 class="fw-bold mb-0 text-dark" id="modalNombre"></h5>
                        <p class="text-muted small mb-3">Cód: <strong id="modalCodigo"></strong></p>

                        <div id="qrcode" class="d-flex justify-content-center mb-2"></div>
                        <small class="text-muted" style="font-size: 0.75rem;">Escanee para ponchar</small>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="window.print()">Imprimir Carnet</button>
                    <a href="/admin" class="btn btn-primary btn-sm">Terminar e Ir al Panel</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let modalCarnetInstance = null;

        async function cargarSiguienteCodigo() {
            try {
                const response = await fetch('/api/empleados/siguiente-codigo');
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('lblCodigo').innerText = data.codigo;
                } else {
                    document.getElementById('lblCodigo').innerText = 'EMP???';
                }
            } catch (error) {
                document.getElementById('lblCodigo').innerText = 'Error';
            }
        }

        cargarSiguienteCodigo();

        document.getElementById('formNuevoEmpleado').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value.trim();
            const fotoInput = document.getElementById('foto');
            const alertaDiv = document.getElementById('mensajeAlerta');

            const formData = new FormData();
            formData.append('nombre', nombre);
            if (fotoInput.files.length > 0) {
                formData.append('foto', fotoInput.files[0]);
            }

            try {
                const response = await fetch('/api/empleados', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('modalNombre').innerText = data.nombre;
                    document.getElementById('modalCodigo').innerText = data.codigo;
                    
                    const fotoContainer = document.getElementById('modalFotoContenedor');
                    if (data.foto && data.foto !== 'default.png') {
                        fotoContainer.innerHTML = `<img src="/static/uploads/${data.foto}" class="rounded-circle border" width="90" height="90" style="object-fit: cover;" alt="Foto">`;
                    } else {
                        fotoContainer.innerHTML = `<div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center mx-auto border" style="width: 90px; height: 90px; font-size: 2rem;">${data.nombre[0].toUpperCase()}</div>`;
                    }

                    document.getElementById('qrcode').innerHTML = "";
                    const urlPoncheNuevo = window.location.origin + "/?codigo=" + data.codigo;

                    new QRCode(document.getElementById('qrcode'), {
                        text: urlPoncheNuevo,
                        width: 128,
                        height: 128,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    modalCarnetInstance = new bootstrap.Modal(document.getElementById('modalCarnet'));
                    modalCarnetInstance.show();

                } else {
                    alertaDiv.innerHTML = `<span class="text-danger fw-bold">${data.error}</span>`;
                }
            } catch (error) {
                alertaDiv.innerHTML = `<span class="text-danger fw-bold">Error de conexión con el servidor.</span>`;
            }
        });
    </script>
    <script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
    </script>
</body>
</html>
